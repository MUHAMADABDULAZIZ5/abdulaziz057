name: Update README with daily quote
on:
  schedule:
    # Runs every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with daily quote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # =========================================================
      # PERUBAHAN DI SINI: Menggunakan @master bukan @v1
      # =========================================================
      - uses: piyushsuthar/github-readme-quotes@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          readme_file: "README.md"
          quote_tag: "QUOTE"
          type: "programming"
