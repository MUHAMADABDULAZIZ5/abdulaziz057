name: Update README with daily quote
on:
  schedule:
    # Runs every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with daily quote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # =========================================================
      # KODE FINAL DENGAN NAMA ACTION YANG BENAR (TANPA '24')
      # =========================================================
      - uses: Gautam-Arora/inspirational-quotes@v1
        with:
          quote_readme_tag: ""
